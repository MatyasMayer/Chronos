<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar and Today prototype</title>
<!-- THROWAWAY PROTOTYPE for "What do the calendar and dashboard look like?" (issue 14).
     Chosen: Week rotated, Day Focus, Month Grid, and Today with Next 7 days below. Earlier rounds stay
     reachable: #round=1, #dv=a (Lanes), c, d; on Today #v=b, #v=c, #q=socket; on the calendar #kinds=shape.
     Everything lives in memory. State is in the URL hash, so a view can be shared. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F0F2EC; --ink: #101A14; --muted: #4A574F; --line: #D3D8CF; --box: #5F6B63; --tickbox: #00612E; --press: #E4E7DF;
  --plate: #00612E; --socket: #00431F; --chalk: #F2F5EE; --chalk-muted: #D4ECD9; --chalk-line: #49845A;
  --yellow: #F4E52E; --yellow-spent: #D6C91F; --on-yellow: #0B0F0D; --live-edge: #00612E;
  --brick: #A5371F; --alert: #A5371F;
  --seg: #00612E; --seg-past: #A9B3AB;
  --slab: #101A14; --slab-ink: #F2F5EE; --slab-muted: #C5CFC8;
  --card: #FFFFFF; --sheet: #FFFFFF;
  --proto: #24184A; --proto-ink: #F3EEFF; --proto-on: #CDBBFF;
  --r: 6px;
  --text: "Barlow", "Segoe UI", system-ui, sans-serif;
  --sign: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --slide: cubic-bezier(.2, .8, .2, 1);
}
:root[data-dark] {
  --paper: #000; --ink: #F2F5EE; --muted: #A9B6AE; --line: #1F2925; --box: #7F8F87; --tickbox: #7F8F87; --press: #101613;
  --socket: #002C12; --brick: #B8432A; --alert: #F2A08A; --seg: #4AA969; --seg-past: #46534D; --live-edge: transparent;
  --slab: #DDE4DC; --slab-ink: #0F1A16; --slab-muted: #3A4A43;
  --card: #141C18; --sheet: #101613;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.35 var(--text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; padding: 0; font: inherit; }
ul { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 3px; }

/* shell, as on Today */
.app { min-height: 100dvh; }
[data-ph] .app { max-width: 430px; margin: 0 auto; }
[data-frame=phone] .app { max-width: 390px; box-shadow: 0 0 0 1px var(--line); }
main { padding: 0 12px 110px; min-width: 0; }
.rail { display: none; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 2px; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); background: var(--paper); border-top: 1.5px solid var(--plate); }
[data-frame=phone] .dock { left: 50%; right: auto; width: 390px; transform: translateX(-50%); }
.dock button { flex: 1; display: grid; justify-items: center; align-content: center; gap: 1px; min-height: 56px; font: 500 17px/1.1 var(--sign); color: var(--muted); border-radius: var(--r); }
.dock button[aria-current] { color: var(--ink); font-weight: 600; }
.dock .add, .rail .add { display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; background: var(--plate); color: var(--chalk); border-radius: var(--r); font: 600 22px/1 var(--sign); }
.dock .add { flex: 0 0 96px; margin-left: 6px; }
:root:not([data-ph]) .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
:root:not([data-ph]) .dock { display: none; }
:root:not([data-ph]) .rail { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100dvh; padding: 20px 16px; border-right: 1px solid var(--line); }
:root:not([data-ph]) main { padding: 0 28px 28px; }
.mark { font: 600 30px/1 var(--sign); padding: 2px 8px 0; }
.rail .add { height: 48px; font-size: 21px; width: 100%; }
.rail nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 8px; border-radius: var(--r); font-weight: 500; color: var(--muted); }
.rail nav button:hover { background: var(--press); color: var(--ink); }
.rail nav button[aria-current] { color: var(--ink); font-weight: 600; background: var(--press); }

/* calendar head: its own structure, no plate and no green tabs */
.ctop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 12px 2px 10px; }
.ctop h1 { font: 600 30px/1.05 var(--sign); }
.ctop h1 small { display: block; font: 500 17px/1.2 var(--sign); color: var(--muted); }
.ctl { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.nav { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r); font: 600 24px/1 var(--sign); }
.nav:hover, .jump:hover { background: var(--press); }
.jump { height: 44px; padding: 0 10px; border-radius: var(--r); font: 600 19px/1 var(--sign); }
.segs { display: flex; padding: 3px; gap: 2px; border-radius: var(--r); background: var(--press); }
.segs button { min-width: 62px; height: 38px; padding: 0 10px; border-radius: 4px; text-align: center; font: 600 19px/1 var(--sign); color: var(--muted); }
.segs button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
[data-ph] .ctl { margin-left: 0; width: 100%; }
[data-ph] .segs { flex: 1; }
[data-ph] .segs button { flex: 1; }
[data-ph] .ctop { padding-top: max(12px, env(safe-area-inset-top)); }

/* one Event, in any structure. Finished hollow, coming green, live yellow, exam ink. */
.e { position: absolute; display: block; overflow: hidden; padding: 3px 6px; border-radius: 3px; font: 500 16px/1.14 var(--sign); text-align: left; }
.e b { font-weight: 600; }
.e span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.e.up { background: var(--plate); color: var(--chalk); }
.e.past { background: var(--paper); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--seg-past); }
.g-col.today .e.past, .l-row.today .e.past { background: var(--card); }
.e.live { background: var(--yellow); color: var(--on-yellow); box-shadow: inset 0 0 0 1.5px var(--live-edge); }
.e .fill { position: absolute; left: 0; top: 0; background: var(--yellow-spent); }
.e.exam.up, .e.exam.live { background: var(--slab); color: var(--slab-ink); box-shadow: none; }
.e.exam b { font-size: 18px; }
.e.half span:nth-of-type(n+2) { display: none; }
[data-ph] .g-col .e, [data-ph] .l-lane .e { padding: 3px 3px; }
[data-ph] .l-lane .e span { text-overflow: clip; }
[data-ph] .l-lane .e { display: flex; align-items: center; }
[data-ph] .g-col .e span { text-overflow: clip; }
[data-ph] .g-col .e:hover { z-index: 2; }
.e.cx { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--seg-past); }
.e.cx b { text-decoration: line-through; }
/* Kinds: Shape, the alternative to the word alone */
[data-kinds=shape] .e.k-lab, [data-kinds=shape] .e.k-tutorial { padding-left: 13px; }
[data-kinds=shape] .e.k-lab::before, [data-kinds=shape] .e.k-tutorial::before { content: ""; position: absolute; z-index: 1; left: 3px; top: 3px; bottom: 3px; width: 4px; background: currentColor; border-radius: 1px; }
[data-kinds=shape] .e.k-assessment.up { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 3px var(--plate); }
[data-kinds=shape] .e.k-course.up { background: transparent; color: var(--ink); box-shadow: none; outline: 1.5px dashed var(--seg); outline-offset: -2px; }

/* the Task's mark everywhere: a square box */
.box { position: relative; display: grid; place-items: center; flex: none; width: 24px; height: 24px; cursor: pointer; }
.box input { position: absolute; inset: -10px; width: 44px; height: 44px; margin: 0; opacity: 0; cursor: pointer; }
.box b { display: grid; place-items: center; width: 18px; height: 18px; border: 2px solid var(--tickbox); border-radius: 3px; }
.box svg { width: 13px; height: 13px; fill: none; stroke: var(--chalk); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.box input:checked + b { background: var(--plate); border-color: var(--plate); }
.box input:checked + b svg { visibility: visible; }
.tk { display: flex; align-items: center; gap: 4px; min-width: 0; min-height: 28px; }
.tk > button { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; line-height: 1.2; }
.tk.done > button { color: var(--muted); text-decoration: line-through; }
.tk.over > button { color: var(--alert); font-weight: 600; }
.flag { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 6px; background: var(--brick); color: #fff; font: 600 17px/1 var(--sign); border-radius: 3px; white-space: nowrap; }
.flag svg.i { width: 14px; height: 14px; stroke-width: 2; }

/* A: Grid. Time runs down, days run across. */
.g { display: grid; min-width: 0; }
.g-head { display: grid; place-items: start; padding: 4px 6px 6px; width: 100%; font: 500 18px/1.1 var(--sign); color: var(--muted); }
.g-head b { font: 600 25px/1.1 var(--sign); color: var(--ink); }
.g-head.today b { display: inline-block; min-width: 34px; padding: 0 5px; background: var(--plate); color: var(--chalk); border-radius: 4px; text-align: center; }
.g-due { min-width: 0; padding: 4px 6px 6px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: grid; align-content: start; gap: 1px; }
.g-lab { font: 500 17px/1 var(--sign); color: var(--muted); padding: 10px 4px 0 0; border-top: 1px solid var(--line); }
.g-col { position: relative; border-left: 1px solid var(--line); border-top: 1px solid var(--line); min-width: 0; }
.g-col.today { background: var(--card); }
.g-col.hol { background: repeating-linear-gradient(135deg, transparent 0 7px, var(--line) 7px 8px); }
.g-hr { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.g-hours { position: relative; }
.g-hours span { position: absolute; right: 6px; transform: translateY(-50%); font: 500 16px/1 var(--sign); color: var(--muted); }
.nowl { position: absolute; z-index: 3; left: 0; right: 0; height: 2px; background: var(--ink); }
.g-hours .nowt { z-index: 4; right: 2px; padding: 0 4px; background: var(--ink); color: var(--paper); font: 600 17px/23px var(--sign); border-radius: 3px; }
.holname { position: absolute; left: 6px; right: 6px; top: 8px; font: 600 17px/1.1 var(--sign); color: var(--muted); }
.cnt { display: inline-flex; align-items: center; gap: 3px; font: 600 17px/1 var(--sign); }
.cnt i { width: 12px; height: 12px; border: 2px solid var(--tickbox); border-radius: 2px; }
.cnt.over { color: var(--alert); }
.cnt.over i { border-color: var(--alert); }

/* month grid */
.m { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.m-wd { padding: 5px 7px; font: 600 18px/1 var(--sign); color: var(--muted); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.m-d { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; width: 100%; min-width: 0; min-height: 122px; padding: 5px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; }
.m-d:hover { background: var(--press); }
.m-d.other { color: var(--muted); }
.m-d.other .m-n { color: var(--muted); }
.m-d.today { background: var(--card); }
.m-n { align-self: flex-start; font: 600 22px/1.15 var(--sign); }
.m-d.today .m-n { padding: 0 6px; background: var(--plate); color: var(--chalk); border-radius: 4px; }
.m-l { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 16px/1.25 var(--sign); }
.m-l.ex { padding: 0 5px; margin-bottom: 2px; background: var(--slab); color: var(--slab-ink); border-radius: 3px; font-weight: 600; }
.m-l.one { color: var(--ink); font-weight: 600; }
.m-l.q { color: var(--muted); }
.m-l.tkm::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; border: 2px solid var(--tickbox); border-radius: 2px; }
.m-l.tkm.over { color: var(--alert); font-weight: 600; }
.m-l.tkm.over::before { border-color: var(--alert); }
/* the small month: a phone, and Board's side */
.mm .m-d { min-height: 54px; padding: 3px 2px; text-align: center; }
.mm .m-n { font-size: 20px; align-self: center; }
.mm .m-d.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.marks { display: flex; justify-content: center; gap: 3px; height: 10px; margin-top: 2px; }
.marks i { width: 9px; height: 9px; border-radius: 2px; }
.marks .ev { height: 4px; margin-top: 3px; width: 12px; background: var(--seg); }
.marks .ex { width: 16px; background: var(--slab); }
.marks .tk2 { border: 2px solid var(--tickbox); }
.marks .ov { border: 2px solid var(--alert); }

/* B: Lanes. Time runs across, one lane per day. */
.l-scale { position: relative; height: 22px; margin-left: var(--lw); }
.l-scale span { position: absolute; font: 500 16px/22px var(--sign); color: var(--muted); padding-left: 3px; }
.l-row { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); border-top: 1px solid var(--line); }
.l-row.today { background: var(--card); }
.l-day { width: 100%; align-self: stretch; padding: 5px 6px; font: 500 17px/1.1 var(--sign); color: var(--muted); }
.l-day b { display: block; font: 600 23px/1.05 var(--sign); color: var(--ink); }
.l-row.today .l-day b { color: var(--ink); }
.l-lane { position: relative; height: var(--lh); margin: 4px 0; background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: calc(100% / 12) 100%; }
.l-row.quiet .l-lane { height: 26px; margin: 3px 0; }
.l-row.quiet .l-day { display: flex; gap: 6px; align-items: baseline; padding-block: 2px; }
.l-row.quiet .l-day b { font-size: 20px; }
.l-due { grid-column: 2; display: flex; flex-wrap: wrap; gap: 0 14px; padding: 0 2px 4px; }
.l-due .tk { max-width: 100%; }
.l-hol { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 8px; font: 600 17px/1 var(--sign); color: var(--muted); }
.l-nowl { position: absolute; z-index: 3; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.l-wk { padding: 10px 0 3px; font: 600 18px/1 var(--sign); color: var(--muted); }
/* a month of lanes: the shape of a whole month */
.lm .l-row { --lw: 62px; }
.lm .l-day { padding: 1px 5px; display: flex; gap: 6px; align-items: baseline; font-size: 16px; }
.lm .l-day b { display: inline; font-size: 19px; }
.lm .l-lane { height: 19px; margin: 3px 0; }
.lm .e { padding: 0; }
.lm .l-tick { position: absolute; z-index: 2; right: 3px; top: 1px; display: flex; align-items: center; gap: 3px; font: 600 16px/17px var(--sign); padding: 0 3px; background: var(--paper); }
.lm .l-row.today .l-tick { background: var(--card); }

/* C: Board. No time scale: rows, like a departures board. */
.b { display: grid; gap: 28px; align-items: start; }
:root:not([data-ph]) .b { grid-template-columns: 340px minmax(0, 1fr); }
:root:not([data-ph]) .b-side { position: sticky; top: 12px; display: grid; gap: 20px; }
.b-h { display: flex; align-items: baseline; gap: 8px; padding: 14px 0 5px; border-bottom: 2px solid var(--ink); font: 600 23px/1.1 var(--sign); }
.b-h small { font: 500 18px/1 var(--sign); color: var(--muted); }
.b-h.past { border-color: var(--line); color: var(--muted); }
.b-h .rel { margin-left: auto; font: 600 18px/1 var(--sign); color: var(--ink); }
.b-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; align-items: baseline; padding: 7px 0 8px; border-bottom: 1px solid var(--line); }
.b-row:hover { background: var(--press); }
.b-t { font: 600 20px/1.15 var(--sign); }
.b-t small { display: block; font: 500 16px/1.1 var(--sign); color: var(--muted); }
.b-m { min-width: 0; }
.b-m b { font: 600 22px/1.15 var(--sign); margin-right: 8px; }
.b-m em { font-style: normal; font-weight: 500; }
.b-m span { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-m span b { font: 600 18px/1 var(--sign); color: var(--ink); margin-right: 3px; }
.b-row.past .b-t, .b-row.past .b-m b, .b-row.past .b-m em, .b-row.past .b-m span b { color: var(--muted); }
.b-row.cx .b-m > b { text-decoration: line-through; }
.chip { padding: 0 7px; font: 600 19px/25px var(--sign); border-radius: 3px; background: var(--yellow); color: var(--on-yellow); box-shadow: inset 0 0 0 1.5px var(--live-edge); }
.word { font: 600 18px/1 var(--sign); color: var(--muted); }
.b-row.exam { padding: 9px 10px 10px; border: 0; background: var(--slab); color: var(--slab-ink); border-radius: var(--r); margin: 5px 0; }
.b-row.exam:hover { background: var(--slab); }
.b-row.exam .b-t small, .b-row.exam .b-m span { color: var(--slab-muted); }
.b-row.exam .b-m span b { color: var(--slab-ink); }
.b-row.exam .word { color: var(--slab-ink); }
.b-tk { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--line); min-height: 44px; }
.b-tk .tk { flex: 1; }
.b-tk .sub { font: 600 18px/1 var(--sign); color: var(--muted); }
.b-fold { display: block; width: 100%; min-height: 44px; padding: 8px 0; color: var(--muted); font: 500 19px/1.2 var(--sign); border-bottom: 1px solid var(--line); }
.b-fold:hover { color: var(--ink); }
.b-none { padding: 10px 0; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.strip button { display: grid; justify-items: center; gap: 1px; padding: 5px 0 6px; border-radius: var(--r); font: 500 17px/1.1 var(--sign); color: var(--muted); }
.strip button b { font: 600 23px/1.1 var(--sign); color: var(--ink); }
.strip button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
.strip button[aria-pressed=true] b { color: var(--paper); }
.strip button[aria-pressed=true] .marks .ev { background: var(--paper); }
.strip button[aria-pressed=true] .marks .ex { background: var(--paper); }
.strip button[aria-pressed=true] .marks .tk2 { border-color: var(--paper); }
.strip button.isnow b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
.sidehead { font: 600 21px/1.1 var(--sign); padding-bottom: 4px; }

/* Today: the plate, ruler and lists come from the Yellow Now prototype */
.top { position: relative; display: flex; align-items: flex-end; min-height: 58px; padding: 6px 4px 8px; line-height: 1.2; }
.top h1 { font-weight: 600; font-size: 17px; }
.top h1 span { display: block; font-weight: 500; font-size: 16px; color: var(--muted); }
:root:not([data-ph]) .top { min-height: 68px; align-items: center; }
:root:not([data-ph]) .top h1 { font-size: 26px; }
:root:not([data-ph]) .top h1 span { display: inline; font-size: 26px; font-weight: 400; margin-left: 6px; }
.route { position: relative; }
.tabs { position: absolute; right: 0; bottom: 100%; display: flex; }
.tab { display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 11px; white-space: nowrap; font: 600 19px/1 var(--sign); border-radius: var(--r) var(--r) 0 0; }
.tab svg.i { width: 18px; height: 18px; stroke-width: 2; }
.tab.over { background: var(--brick); color: #fff; }
.tab.due { background: var(--plate); color: var(--chalk); margin-left: 2px; }
.plate { position: relative; z-index: 1; display: grid; background: var(--plate); color: var(--chalk); border-radius: var(--r); border-top-right-radius: 0; padding: 4px 4px 0; }
:root:not([data-ph]) .plate { grid-template-columns: 1fr 1fr; padding: 4px; }
.plate.one { grid-template-columns: 1fr !important; }
.slot { position: relative; padding: 10px 12px 12px; min-width: 0; container-type: inline-size; }
.label { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 20px/1.2 var(--sign); }
.label > b { font-size: 24px; font-weight: 600; }
.label > span { display: flex; gap: 12px; white-space: nowrap; }
.label > span b { font-weight: 600; }
.code { position: relative; font: 600 min(92px, calc(100cqi / 3.72))/1 var(--sign); white-space: nowrap; }
.cap { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; font-weight: 500; }
.cap b { font-weight: 600; }
.now { background: var(--yellow); color: var(--on-yellow); border-radius: 3px; overflow: hidden; }
.now .code { font-size: min(120px, calc(100cqi / 2.6)); line-height: .94; margin-top: 2px; }

    + grp('theme', [['dark', 'Black'], ['light', 'Light']])
    + `<span class="grp keep"><button type="button" data-tuck aria-label="Toggle controls">${S.tuck ? '+' : '–'}</button></span>`;
}
function render() {
  const r = document.documentElement, ph = isPh();
  ph ? r.setAttribute('data-ph', '') : r.removeAttribute('data-ph');
  S.theme === 'dark' ? r.setAttribute('data-dark', '') : r.removeAttribute('data-dark');
  r.dataset.frame = S.f; r.dataset.kinds = S.kinds;
  document.getElementById('page').innerHTML = S.s === 'cal' ? calendar() : today();
  document.getElementById('overlay').innerHTML = S.s === 'cal' && S.j ? jumper() : drawer();
  nav(); bar();
  fit();
}
function fit() {
  document.querySelectorAll('.code').forEach(c => {
    c.style.fontSize = '';
    const g = document.createRange(); g.selectNodeContents(c);
    const w = g.getBoundingClientRect().width, room = c.clientWidth;
    if (w > room) c.style.fontSize = Math.floor(parseFloat(getComputedStyle(c).fontSize) * room / w) + 'px';
  });
}
const KEYS = ['s', 'v', 'dv', 'round', 'j', 'sel', 'view', 'st', 'f', 'theme', 'kinds', 'q', 'tw', 'at', 'pick', 'open'];
function save() {
  const p = new URLSearchParams();
  KEYS.forEach(k => { if (S[k]) p.set(k, S[k]); });
  history.replaceState(null, '', '#' + p);
  render();
}
function load() {
  const p = new URLSearchParams(location.hash.slice(1));
  KEYS.forEach(k => { if (p.has(k)) S[k] = p.get(k); });
  if (p.has('shot')) document.documentElement.setAttribute('data-shot', '');
  if (!p.has('theme') && !matchMedia('(prefers-color-scheme: dark)').matches) S.theme = 'light';
  S.tuck = innerWidth < 700;
  settle();
  render();
}
T.forEach(t => { t.was = !!t.done; });
const settle = () => T.forEach(t => { t.done = S.st === 'weekend' && t.d <= '2026-11-06' ? true : t.was; });
function step(n) {
  const at = S.at || now().d;
  if (S.view === 'month') { const d = D(at.slice(0, 8) + '15'); d.setUTCMonth(d.getUTCMonth() + n); S.at = iso(d); }
  else S.at = add(at, n * (S.view === 'day' ? 1 : 7));
  S.pick = null;
}
function cycle(n) {
  if (S.s === 'cal' && S.round !== '1') { if (S.view !== 'day') return; const ks = 'abcd'; S.dv = ks[(ks.indexOf(S.dv) + n + 4) % 4]; S.sel = null; return; }
  const ks = 'abc'; S.v = ks[(ks.indexOf(S.v) + n + 3) % 3];
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-set],[data-cycle],[data-tuck],[data-screen],[data-view],[data-step],[data-home],[data-day],[data-pick],[data-open],[data-close],[data-tw],[data-tday],[data-earlier],[data-jump],[data-jclose],[data-jy],[data-jm],[data-jd],[data-jw],[data-jtoday],[data-sel]');
  if (!t) return;
  const d = t.dataset;
  if (d.set) { const [k, v] = d.set.split('='); S[k] = v; if (k === 'st') { S.at = null; S.pick = null; settle(); } }
  else if (d.cycle) cycle(+d.cycle);
  else if ('jump' in d) S.j = S.j ? null : (S.at || now().d).slice(0, 7);
  else if ('jclose' in d) S.j = null;
  else if (d.jy) S.j = (+S.j.slice(0, 4) + +d.jy) + S.j.slice(4);
  else if (d.jm) { if (S.view === 'month') { S.at = d.jm + '-01'; S.j = null; S.pick = null; } else S.j = d.jm; }
  else if (d.jd) { S.at = d.jd; if (S.view === 'month') S.view = 'day'; S.j = null; S.pick = null; S.sel = null; }
  else if (d.jw) { S.at = d.jw; S.view = 'week'; S.j = null; S.pick = null; }
  else if ('jtoday' in d) { S.at = null; S.j = null; S.pick = null; S.sel = null; }
  else if (d.sel) S.sel = d.sel;
  else if ('tuck' in d) S.tuck = !S.tuck;
  else if ('earlier' in d) S.earlier = true;
  else if (d.screen) { S.s = d.screen; S.pick = null; S.at = null; }
  else if (d.view) { S.view = d.view; S.pick = null; }
  else if (d.step) { step(+d.step); S.sel = null; }
  else if ('home' in d) { S.at = null; S.pick = null; }
  else if (d.day) { if (S.s === 'cal') { S.at = d.day; S.view = 'day'; S.pick = null; S.sel = null; } }
  else if (d.pick) { S.pick = d.pick; if (S.s === 'cal' && S.v === 'c' && S.view !== 'month') { S.at = d.pick; S.view = 'day'; S.pick = null; } }
  else if (d.tday) { S.s = 'cal'; S.v = 'a'; S.view = 'day'; S.at = d.tday; }
  else if (d.open) S.open = d.open;
  else if ('close' in d) S.open = null;
  else if (d.tw) S.tw = d.tw;
  if (d.screen || d.view || d.step || d.jd || d.jw || d.jm) scrollTo(0, 0);
  save();
});
document.addEventListener('change', ev => {
  const id = ev.target.dataset.tick; if (!id) return;
  T.find(t => t.id === id).done = ev.target.checked; render();
});
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && (S.open || S.j)) { S.open = null; S.j = null; save(); }
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { cycle(ev.key === 'ArrowRight' ? 1 : -1); save(); }
});
addEventListener('resize', render);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
load();
</script>
