<!doctype html>
<!-- PROTOTYPE, throwaway. Five Today screens hand-built from the token blocks in research/ai-ui-skills.md.
     These are derivations from each tool's written rules, NOT output from running the tools.
     Switch with the bottom bar, arrow keys, or ?variant=T|R|W|F|S&mode=light|dark. Never merge to main. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE: Chronos looks from AI design tools</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&family=Chivo+Mono:wght@400;500;800&family=Schibsted+Grotesk:wght@400..800&family=Geist:wght@400..700&family=Inter:wght@400..600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#16161a;color:#ededf0;font-family:Inter,system-ui,sans-serif}
body{margin:0;padding:0 0 76px}
h1,h2,h3,p{margin:0}
.sec{font:600 12px/1 Inter,sans-serif;opacity:.65;margin:22px 0 10px}
.pitch{font-size:14px;line-height:1.5;opacity:.85;margin-top:4px}
.name{font:600 22px/1.2 Inter,sans-serif}
.fit{overflow:hidden;border-radius:10px}
.row2{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;padding:6px}
.info{flex:1;min-width:240px;font-size:13px;line-height:1.8}
.ic{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.t{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:var(--fs);line-height:1.35;font-variant-numeric:tabular-nums}
.sub{--c:oklch(var(--sl) var(--sc) var(--h))}
.mu{color:var(--mu)}.over{color:var(--red)}
.desk{width:1120px;height:600px;display:flex;overflow:hidden}
.phone{width:320px;height:660px;border-radius:36px;display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none;outline:6px solid #0006;--fs:16px}
.status{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:12px;font-weight:600}
.pb{flex:1;overflow:hidden;padding:12px 16px}
.tabs{display:flex;justify-content:space-around;padding:10px 8px 20px;font-size:11px;color:var(--mu);border-top:1px solid var(--rule)}
.tabs b{font-weight:600;color:var(--tab,var(--ac))}
.sq{width:9px;height:9px;background:var(--c);display:inline-block;flex:none;border-radius:2px}
.cell{display:flex;gap:7px;align-items:center;min-width:0}
.cell span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rare{font-weight:600}
.past{opacity:.5}
.nav a{display:flex;gap:9px;align-items:center;min-width:0;padding:6px 9px;white-space:nowrap;overflow:hidden}

/* T Timetable, from Impeccable */
.T{--font:"Hanken Grotesk",sans-serif;--fs:14px;--sc:.12;--sl:.55}
.T[data-m=light]{--bg:oklch(97.5% .008 255);--bg2:oklch(94.5% .012 255);--tx:oklch(22% .02 255);--mu:oklch(45% .02 255);--ac:oklch(50% .16 255);--red:oklch(52% .2 25);--rule:oklch(90% .012 255);--shell:oklch(32% .07 255)}
.T[data-m=dark]{--bg:oklch(17% .02 255);--bg2:oklch(23% .025 255);--tx:oklch(94% .01 255);--mu:oklch(72% .02 255);--ac:oklch(72% .13 255);--red:oklch(72% .17 25);--rule:oklch(26% .025 255);--shell:oklch(22% .05 255);--sl:.72}
.T .shell{width:224px;background:var(--shell);color:oklch(88% .03 255);padding:14px 8px;flex:none}
.T .shell a{border-radius:6px}.T .shell a.on{background:oklch(100% 0 0/.13);color:#fff}
.T .shell .sub{--sl:.78}
.T .main{flex:1;padding:22px 30px;min-width:0}
.T h1{font-size:23px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px}
.T h2{font-size:14px;font-weight:600;margin:18px 0 4px}
.T .r{display:grid;grid-template-columns:72px 88px 1fr auto;gap:0 10px;align-items:center;min-height:36px;border-bottom:1px solid var(--rule)}
.T .r.now{background:var(--bg2);box-shadow:-10px 0 0 var(--bg2),10px 0 0 var(--bg2);border-radius:2px}
.T .phone .r,.phone.T .r{grid-template-columns:52px 1fr auto;min-height:48px}
.phone.T .code,.phone.T .r>.mu:last-child{display:none}.phone.T .r{grid-template-columns:52px 1fr!important}
.phone.T h1{font-size:23px}

/* R Day rail, from Interface Design */
.R{--font:"Instrument Sans",sans-serif;--fs:14px;--sc:.12;--sl:.55}
.R[data-m=light]{--bg:#F6F7F5;--bg2:#FFFFFF;--tx:#1C2120;--mu:#5E6866;--rule:rgba(28,33,32,.1);--ac:#2F5FD0;--red:#C2412D;--hl:#C9E265;--hlx:#1C2120}
.R[data-m=dark]{--bg:#141716;--bg2:#212524;--tx:#ECEFEE;--mu:#A1ABA8;--rule:rgba(255,255,255,.08);--ac:#86A8F0;--red:#EE8A76;--hl:#C9E265;--hlx:#1C2120;--sl:.72}
.R .side{width:248px;border-right:1px solid var(--rule);padding:14px 10px;flex:none;color:var(--mu)}
.R .side a{border-radius:6px}.R .side a.on{background:var(--bg2);color:var(--tx)}
.R .main{flex:1;padding:24px 34px;display:grid;grid-template-columns:1fr 300px;gap:40px;min-width:0}
.R .day{display:grid;grid-template-columns:22px 1fr;gap:0 14px}
.R .ln{position:relative}.R .ln:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--rule)}
.R .ln i{position:absolute;left:5px;width:12px;height:12px;border-radius:3px;background:var(--hl);top:96px;box-shadow:0 0 0 3px var(--bg)}
.R .focal{padding-bottom:18px}
.R .focal .k{display:inline-block;background:var(--hl);color:var(--hlx);font-weight:600;padding:1px 7px;border-radius:4px;font-size:12px}
.R .focal h1{font-size:28px;font-weight:600;letter-spacing:-.015em;margin:8px 0 2px}
.R .r{display:grid;grid-template-columns:52px 1fr;gap:10px;min-height:36px;align-items:center}
.R h2{font-size:14px;font-weight:600;margin-bottom:6px}
.R .d{display:grid;grid-template-columns:1fr auto;gap:10px;min-height:36px;align-items:center}
.phone.R .r,.phone.R .d{min-height:48px}.phone.R .focal h1{font-size:24px}

/* W Departure board, from Hallmark's Wayfind theme */
.W{--font:"Chivo Mono",monospace;--fs:13px;--sc:.13;--sl:.5}
.W[data-m=light]{--bg:oklch(95.5% .006 250);--bg2:oklch(91% .009 250);--tx:oklch(16% .014 262);--mu:oklch(47% .016 260);--rule:oklch(80% .011 250);--ac:oklch(51% .22 264);--red:oklch(50% .2 27);--plate:oklch(16% .014 262)}
.W[data-m=dark]{--bg:oklch(15% .012 262);--bg2:oklch(21% .013 262);--tx:oklch(96% .005 250);--mu:oklch(72% .015 250);--rule:oklch(32% .015 260);--ac:oklch(62% .2 264);--red:oklch(72% .17 27);--plate:oklch(24% .02 262);--sl:.74}
.W.desk{flex-direction:column}
.W .top{display:flex;gap:26px;padding:12px 26px;border-bottom:2px solid var(--tx);align-items:baseline}
.W .top b{font-weight:800;font-size:16px;margin-right:auto}
.W .main{padding:18px 26px;flex:1}
.W .plate{background:var(--plate);color:oklch(96% .005 250);padding:14px 16px;display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;margin-bottom:14px}
.W .plate b{font-weight:800;font-size:22px}.W .amber{color:oklch(81% .16 82);font-weight:800;font-size:22px}
.W .r{display:grid;grid-template-columns:100px 110px 1fr 130px;gap:12px;min-height:34px;align-items:center;border-bottom:2px solid var(--rule)}
.W .r.hd{color:var(--mu);border-bottom:2px solid var(--tx);min-height:26px}
.W h2{font-size:13px;font-weight:800;margin:16px 0 2px}
.phone.W{--fs:14px}
.phone.W .r{grid-template-columns:58px 1fr;min-height:46px}.phone.W .room,.phone.W .code{display:none}
.phone.W .plate{grid-template-columns:1fr auto;padding:12px}.phone.W .plate .tm{display:none}.phone.W .plate b,.phone.W .amber{font-size:17px}

/* F Blackboard, from Anthropic frontend-design */
.F{--font:"Schibsted Grotesk",sans-serif;--fs:15px;--sc:.11;--sl:.5;--tab:var(--tx)}
.F[data-m=light]{--bg:#EEF2F0;--tx:#1E2624;--mu:#5A6763;--rule:rgba(30,38,36,.12);--ac:#173B33;--red:#C8402F;--line:#B8901A}
.F[data-m=dark]{--bg:#12201C;--tx:#EEF2F0;--mu:#A3B2AD;--rule:rgba(238,242,240,.12);--ac:#E8C547;--red:#EE8373;--line:#E8C547;--sl:.74}
.F .strip{width:76px;background:#173B33;color:#EEF2F0;display:flex;flex-direction:column;gap:20px;align-items:center;padding:20px 0;font-size:20px;flex:none}
.F .strip .on{color:#E8C547}
.F .main{flex:1;padding:26px 44px;display:grid;grid-template-columns:1fr 320px;gap:48px;min-width:0}
.F h1{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-bottom:20px}
.F .r{display:grid;grid-template-columns:62px 1fr;gap:12px;min-height:40px;align-items:center}
.F .nowl{height:2px;background:var(--line);margin:3px 0;position:relative}
.F .nowl span{position:absolute;right:0;top:-20px;font-size:12px;font-weight:600;color:var(--line)}
.F h2{font-size:20px;font-weight:600;margin:6px 0 8px}
.F .d{display:grid;grid-template-columns:1fr auto;gap:10px;min-height:40px;align-items:center}
.F .ph{background:#173B33;color:#EEF2F0;padding:12px 18px 16px;margin:-12px -16px 10px}
.F .ph h1{font-size:40px;margin:0}
.phone.F .r,.phone.F .d{min-height:48px}

/* S default shadcn baseline */
.S{--font:Geist,Inter,sans-serif;--fs:14px;--sc:.13;--sl:.6}
.S[data-m=light]{--bg:oklch(1 0 0);--bg2:oklch(.985 0 0);--tx:oklch(.145 0 0);--mu:oklch(.5 0 0);--rule:oklch(.922 0 0);--ac:oklch(.205 0 0);--acx:oklch(.985 0 0);--red:oklch(.577 .245 27)}
.S[data-m=dark]{--bg:oklch(.145 0 0);--bg2:oklch(.205 0 0);--tx:oklch(.985 0 0);--mu:oklch(.708 0 0);--rule:oklch(1 0 0/.1);--ac:oklch(.922 0 0);--acx:oklch(.205 0 0);--red:oklch(.704 .191 22);--sl:.7}
.S .side{width:240px;background:var(--bg2);border-right:1px solid var(--rule);padding:12px 8px;flex:none}
.S .side a{border-radius:8px}.S .side a.on{background:var(--rule);font-weight:500}
.S .main{flex:1;padding:22px;min-width:0}
.S h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px}
.S .g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.S .card{border:1px solid var(--rule);border-radius:14px;padding:16px;box-shadow:0 1px 2px #0000000d}
.S .card h2{font-size:15px;font-weight:600}.S .card p{color:var(--mu);margin-bottom:10px;font-size:13px}
.S .r{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:36px;border-top:1px solid var(--rule)}
.S .badge{border:1px solid var(--rule);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.S .badge.solid{background:var(--ac);color:var(--acx);border-color:transparent}
.S .badge.red{background:var(--red);color:#fff;border-color:transparent}
.S .btn{background:var(--ac);color:var(--acx);border-radius:8px;padding:6px 12px;font-weight:500;display:inline-block;margin-top:10px}
.phone.S .g{grid-template-columns:1fr}.phone.S .card{padding:12px}.phone.S .r{min-height:44px}.phone.S{--fs:15px}

#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#000;color:#fff;padding:6px 8px;border-radius:999px;font:500 13px Inter,sans-serif;box-shadow:0 6px 24px #0007;z-index:9;white-space:nowrap}
#bar button{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px}#bar button:hover{background:#fff3}
</style></head><body>
<div id="app"></div>
<div id="bar"><button id="p">←</button><span id="l"></span><button id="n">→</button><button id="m"></button></div>
<script>
const P={lecture:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
lab:'<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
exam:'<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
presentation:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24">${P[k]}</svg>`;
const S={OSY:[250,'BI-OSY','Operační systémy'],PSI:[165,'BI-PSI','Počítačové sítě'],AAG:[305,'BI-AAG','Automaty a gramatiky'],SP1:[60,'BI-SP1','Softwarový projekt 1'],ZUM:[15,'BI-ZUM','Základy umělé inteligence']};
const E=[{t:'09:15',k:'lecture',s:'OSY',n:'Lecture',r:'TH:A-1242',past:1},{t:'11:00',k:'lab',s:'PSI',n:'Lab',r:'T9:350',now:1},{t:'14:30',k:'lecture',s:'AAG',n:'Lecture',r:'TH:A-1442'},{t:'16:15',k:'presentation',s:'SP1',n:'Project presentation',r:'T9:105'}];
const X={t:'Fri 09:00',k:'exam',s:'ZUM',n:'Midterm',r:'TH:A-1242'};
const D=[{s:'OSY',n:'Homework 3',d:'Yesterday',o:1},{s:'PSI',n:'Lab report',d:'Today 23:59'},{s:'SP1',n:'Finish the slides',d:'Fri'}];
const h=s=>`--h:${S[s][0]}`, rare=e=>e.k=='exam'||e.k=='presentation';
const sq=s=>`<i class="sq sub" style="${h(s)}"></i>`;
const title=e=>`<div class="cell ${rare(e)?'rare':''}"><span class="sub" style="${h(e.s)};display:contents">${ic(e.k)}</span><span>${e.n}</span></div>`;
const subjects=()=>Object.keys(S).map(k=>`<a>${sq(k)}<span>${S[k][2]}</span></a>`).join('');
const nav=`<a class="on">${ic('home')}Today</a><a>${ic('cal')}Calendar</a><a>${ic('book')}Subjects</a><a>${ic('search')}Search</a>`;
const tabs=`<div class="tabs"><b>Today</b><span>Calendar</span><span>Subjects</span><span>Search</span></div>`;
const st=`<div class="status"><span>11:40</span><span>5G</span></div>`;
const wc=e=>({...e,n:S[e.s][1]+' '+e.n});
const phone=(b,pre='')=>`${st}${pre}<div class="pb">${b}</div>${tabs}`;

const trow=e=>`<div class="r ${e.now?'now':''} ${e.past?'past':''}"><span class="mu">${e.t.replace('Fri ','')}</span><span class="cell code">${sq(e.s)}<span>${S[e.s][1]}</span></span>${title(e)}<span class="mu">${e.r}</span></div>`;
const tdue=d=>`<div class="r"><span class="${d.o?'over':'mu'}">${d.d.replace(' 23:59','').replace('Yesterday','Wed')}</span><span class="cell code">${sq(d.s)}<span>${S[d.s][1]}</span></span><span>${d.n}</span><span></span></div>`;
const rrow=e=>`<div class="r ${e.past?'past':''}"><span class="mu">${e.t.replace('Fri ','')}</span><div class="cell ${rare(e)?'rare':''}">${sq(e.s)}<span>${S[e.s][1]} ${e.n}</span></div></div>`;
const rdue=d=>`<div class="d"><div class="cell">${sq(d.s)}<span>${d.n}</span></div><span class="${d.o?'over':'mu'}">${d.d}</span></div>`;
const wrow=e=>`<div class="r ${e.past?'past':''}"><span>${e.t}</span><span class="code">${S[e.s][1]}</span><span class="${rare(e)?'rare':''}" style="font-weight:${rare(e)?800:400}">${e.n}</span><span class="room mu">${e.r}</span></div>`;
const frow=e=>`<div class="r ${e.past?'past':''}"><span class="mu">${e.t.replace('Fri ','')}</span><div class="cell ${rare(e)?'rare':''}">${sq(e.s)}<span>${S[e.s][1]} ${e.n}</span></div></div>`;
const fdue=d=>`<div class="d"><span>${d.n}</span><span class="${d.o?'over':'mu'}">${d.d}</span></div>`;

const V={
T:{name:'Timetable',tool:'Impeccable (Operate mode)',pitch:'A well-made tool first. An ink-blue rail, and Events set in the strict column rhythm of a printed university schedule: time, Subject code, title, room. Tasks follow the same columns.',facts:'Hanken Grotesk · rows 36/48px · corners 6-8px · small Subject squares',
 body:()=>`<h1>Thursday 5 November</h1>${E.map(trow).join('')}<h2>Tomorrow</h2>${trow(X)}<h2>Due soon</h2>${D.map(tdue).join('')}`,
 desk(){return `<div class="shell nav">${nav}<div style="margin:16px 9px 6px;font-size:12px;opacity:.7">B261</div>${subjects()}</div><div class="main">${this.body()}</div>`},
 ph(){return phone(`<h1>Today</h1>${E.map(wc).map(trow).join('')}<h2>Due soon</h2>${D.slice(0,2).map(d=>({...d,n:S[d.s][1]+' '+d.n})).map(tdue).join('')}`)}},
R:{name:'Day rail',tool:'Interface Design',pitch:'The calmest. A thin rail of the day runs down the left and marks where you are. The current Event is the one focal point; everything else is quiet tone on tone, no boxes. Highlighter green means now and nothing else.',facts:'Instrument Sans · rows 36/48px · corners 6-14px · no shadows',
 body(){return `<div class="day"><div class="ln"><i></i></div><div>${rrow(E[0])}<div class="focal"><span class="k">Now, until 12:30</span><h1>BI-PSI Lab</h1><div class="mu">T9:350</div></div>${rrow(E[2])}${rrow(E[3])}</div></div>`},
 desk(){return `<div class="side nav">${nav}<div class="mu" style="margin:16px 9px 6px;font-size:12px">B261</div>${subjects()}</div><div class="main"><div><div class="mu" style="margin-bottom:12px">Thursday 5 November</div>${this.body()}</div><div><h2 style="margin-top:32px">Due soon</h2>${D.map(rdue).join('')}</div></div>`},
 ph(){return phone(`<div class="mu" style="margin-bottom:10px">Thursday 5 November</div>${this.body()}<h2 style="margin-top:14px">Due soon</h2>${D.slice(0,2).map(rdue).join('')}`)}},
W:{name:'Departure board',tool:'Hallmark (Wayfind theme)',pitch:'The boldest, and the outer limit. Every glyph is mono, rules are heavy, corners are square, and the current Event sits on an ink plate with amber minutes. The theme forbids a proportional font, so Notes would have to break it.',facts:'Chivo Mono · rows 34/46px · corners 0 · 2px ink rules',
 plate:()=>`<div class="plate"><span class="tm">11:00</span><b>BI-PSI Lab</b><span class="amber">50 min left</span></div>`,
 desk(){return `<div class="top"><b>Chronos</b><span>Today</span><span class="mu">Calendar</span><span class="mu">Subjects</span><span class="mu">Search</span></div><div class="main">${this.plate()}<div class="r hd"><span>Time</span><span>Subject</span><span>Event</span><span>Room</span></div>${[E[2],E[3],X].map(wrow).join('')}<h2>Due soon</h2>${D.map(d=>`<div class="r"><span class="${d.o?'over':''}">${d.d.replace('Yesterday','Wed').replace(' 23:59','')}</span><span>${S[d.s][1]}</span><span>${d.n}</span><span></span></div>`).join('')}</div>`},
 ph(){return phone(`${this.plate()}${[E[2],E[3]].map(wc).map(wrow).join('')}<h2>Due soon</h2>${D.slice(0,2).map(d=>`<div class="r"><span class="${d.o?'over':''}">${d.d.replace('Yesterday','Wed').replace(' 23:59','')}</span><span>${S[d.s][1]} ${d.n}</span></div>`).join('')}`)}},
F:{name:'Blackboard',tool:'Anthropic frontend-design (control)',pitch:'Grounded in the lecture hall: board green, chalk white and a chalk-yellow line for now. All the boldness goes into one place, the huge date. It is the most personal of the five and the least like a standard app.',facts:'Schibsted Grotesk · rows 40/48px · corners 6-16px · one bold move',
 list:()=>`${frow(E[0])}${frow(E[1])}<div class="nowl"><span>Now</span></div>${frow(E[2])}${frow(E[3])}`,
 desk(){return `<div class="strip"><span class="on">${ic('home')}</span>${ic('cal')}${ic('book')}${ic('search')}</div><div class="main"><div><h1>Thursday 5</h1>${this.list()}</div><div style="padding-top:64px"><h2>Due soon</h2>${D.map(fdue).join('')}</div></div>`},
