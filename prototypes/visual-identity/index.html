<!doctype html>
<!-- PROTOTYPE, throwaway. Four visual directions for "What is Chronos's visual identity?".
     Switch with the bottom bar, the arrow keys, or ?variant=A|B|C|D&mode=light|dark. Never merge to main. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE: Chronos visual identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:opsz,wght@6..72,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:var(--background,#16161a);color:var(--foreground,#ededf0);font-family:Inter,system-ui,sans-serif}
body{margin:0;padding:0 0 76px}
h1,h2,h3,p{margin:0}
.sec{font:600 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:24px 0 10px}
.pitch{font-size:14px;line-height:1.5;opacity:.85;margin-top:4px}
.name{font:600 22px/1.2 Inter,sans-serif}
.fit{overflow:hidden;border-radius:10px}
.row2{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* tokens: every direction fills the same slots */
.t{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:var(--fs);line-height:1.4;font-variant-numeric:tabular-nums}
.t .sub{--c:oklch(var(--sl) var(--sc) var(--h))}
.t .t2{color:var(--tx2)} .t .t3{color:var(--tx3)}
.desk{width:1120px;height:580px;display:flex;overflow:hidden}
.phone{width:320px;height:660px;border-radius:36px;display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none;outline:6px solid #0006}
.scroll{flex:1;overflow:hidden;padding:var(--pad)}
.tabs{display:flex;justify-content:space-around;padding:10px 8px 20px;background:var(--bg2);font-size:10px;color:var(--tx3)}
.tabs b{font-weight:600;color:var(--ac)}
.status{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.over{color:var(--red)}

/* tile */
.tile{padding:16px;border-radius:10px;flex:1;min-width:300px}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw i{width:38px;height:38px;border-radius:var(--r);display:block;box-shadow:inset 0 0 0 1px #8883}
.spec{margin:12px 0}
.spec .h{font-family:var(--head);font-size:30px;font-weight:var(--hw);letter-spacing:var(--ls);line-height:1.1}
.kinds{display:grid;gap:8px;margin-top:4px}
.btns{display:flex;gap:8px;align-items:center;margin-top:12px}
.btn{padding:7px 13px;border-radius:var(--r);background:var(--ac);color:var(--acx);font-weight:600;font-size:13px}
.btn.g{background:var(--bg2);color:var(--tx)}

/* Event block, weight says how rare it is */
.ev{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:var(--r);font-size:13px;min-width:0}
.ev .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.lecture{box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--k) 45%,transparent)}
.ev.lab{background:color-mix(in oklch,var(--k) 16%,transparent)}
.ev.exam,.ev.presentation{background:var(--k);color:var(--kx);font-weight:600}
.ev.past{opacity:.45}
.ev{--k:oklch(var(--solid,var(--sl)) var(--sc) var(--h))}
.A[data-m=light],.D[data-m=light]{--solid:.5}.B[data-m=light]{--solid:.47}

/* A Graphite: dense, sidebar, Linear-school */
.A{--font:Inter,sans-serif;--head:Inter,sans-serif;--hw:600;--ls:-.02em;--fs:13px;--r:6px;--pad:14px;--sl:.66;--sc:.13;--kx:#fff}
.A[data-m=light]{--bg:oklch(.985 .002 90);--bg2:oklch(.955 .003 90);--tx:oklch(.24 .006 270);--tx2:oklch(.47 .006 270);--tx3:oklch(.58 .006 270);--ac:oklch(.52 .19 272);--acx:#fff;--red:oklch(.55 .2 27)}
.A[data-m=dark]{--bg:oklch(.2 .006 270);--bg2:oklch(.17 .006 270);--tx:oklch(.94 .004 270);--tx2:oklch(.72 .006 270);--tx3:oklch(.6 .006 270);--ac:oklch(.68 .15 272);--acx:oklch(.18 .02 272);--red:oklch(.7 .17 27);--sl:.72;--kx:oklch(.18 .01 270)}
.A .side{width:208px;background:var(--bg2);padding:14px 10px;color:var(--tx2);flex:none}
.A .side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:var(--r)}
.A .side a.on{background:color-mix(in oklch,var(--tx) 8%,transparent);color:var(--tx)}
.A .main{flex:1;padding:18px 26px;display:grid;grid-template-columns:1fr 330px;gap:28px;align-content:start}
.A h3{font-size:12px;font-weight:600;color:var(--tx2);margin:14px 0 6px}
.A .ln{display:flex;gap:10px;align-items:center;min-height:34px}
.A .ln .tm{width:44px;color:var(--tx3)}
.A .ln .ev{flex:1}

/* B Paper: editorial, one column, serif headings, no sidebar */
.B{--font:Inter,sans-serif;--head:Newsreader,Georgia,serif;--hw:500;--ls:-.01em;--fs:15px;--r:4px;--pad:22px;--sl:.56;--sc:.1;--kx:#fffdf8}
.B[data-m=light]{--bg:oklch(.975 .012 85);--bg2:oklch(.945 .016 85);--tx:oklch(.27 .02 60);--tx2:oklch(.45 .02 60);--tx3:oklch(.55 .02 60);--ac:oklch(.5 .13 40);--acx:#fffdf8;--red:oklch(.52 .19 25)}
.B[data-m=dark]{--bg:oklch(.21 .012 60);--bg2:oklch(.25 .014 60);--tx:oklch(.93 .012 85);--tx2:oklch(.74 .014 80);--tx3:oklch(.63 .014 80);--ac:oklch(.72 .12 50);--acx:oklch(.2 .02 50);--red:oklch(.72 .15 27);--sl:.74;--kx:oklch(.2 .012 60)}
.B .col{width:640px;margin:0 auto;padding:14px 0}
.B.desk{display:block}
.B .top{display:flex;justify-content:space-between;padding:16px 28px 0;color:var(--tx2);font-size:14px}
.B .top b{font-family:var(--head);font-weight:600;font-size:18px;color:var(--tx)}
.B h1{font:500 44px/1.05 var(--head);letter-spacing:-.015em}
.B .m{font-family:var(--head);font-size:21px;margin:26px 0 6px;font-weight:500}
.B .ln{display:grid;grid-template-columns:82px 1fr;padding:8px 0;align-items:baseline}
.B .ln .ev{padding:0;background:none!important;box-shadow:none;color:inherit;font-size:15px;font-weight:400}
.B .ln .ev.exam,.B .ln .ev.presentation{font-weight:600;color:var(--c)}
.B .ln .ev .ic{color:var(--c)}

/* C Instrument: sharp, mono, the week grid is home, colour = kind */
.C{--font:Inter,sans-serif;--head:"JetBrains Mono",monospace;--hw:600;--ls:-.03em;--fs:12.5px;--r:1px;--pad:12px;--sl:.7;--sc:.15}
.C[data-m=light]{--bg:oklch(.97 0 0);--bg2:oklch(.93 0 0);--tx:oklch(.2 0 0);--tx2:oklch(.42 0 0);--tx3:oklch(.54 0 0);--ac:oklch(.6 .19 40);--acx:#000;--red:oklch(.55 .22 27);--line:oklch(.86 0 0);--kl:oklch(.45 .1 240);--kb:oklch(.47 .1 165);--ke:oklch(.42 .17 300);--kp:oklch(.48 .13 90);--kx:#fff}
.C[data-m=dark]{--bg:oklch(.15 0 0);--bg2:oklch(.2 0 0);--tx:oklch(.95 0 0);--tx2:oklch(.72 0 0);--tx3:oklch(.6 0 0);--ac:oklch(.75 .17 50);--acx:#000;--red:oklch(.7 .2 27);--line:oklch(.28 0 0);--kl:oklch(.76 .1 240);--kb:oklch(.78 .12 165);--ke:oklch(.76 .15 300);--kp:oklch(.82 .14 90);--kx:#000}
.C .ev.lecture{--k:var(--kl)}.C .ev.lab{--k:var(--kb)}.C .ev.exam{--k:var(--ke)}.C .ev.presentation{--k:var(--kp)}
.C .rail{width:48px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;align-items:center;padding:14px 0;font-size:18px;color:var(--tx3);flex:none}
.C .rail .on{color:var(--ac)}
.C .gridw{flex:1;display:flex;flex-direction:column;min-width:0}
.C .hd{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--head)}
.C .hd b{font-size:15px}
.C .grid{flex:1;position:relative;display:grid;grid-template-columns:44px repeat(5,1fr)}
.C .gc{border-right:1px solid var(--line);position:relative;font:500 11px var(--head);padding:6px;color:var(--tx2)}
.C .gc.now{color:var(--ac);background:color-mix(in oklch,var(--ac) 6%,transparent)}
.C .blk{color:var(--tx);position:absolute;left:3px;right:3px;font-size:11px;display:block;white-space:normal;padding:4px 6px;font-family:var(--font);line-height:1.25;overflow:hidden}
.C .blk.exam,.C .blk.presentation{color:var(--kx)}
.C .hr{position:absolute;left:6px;color:var(--tx3)}
.C .nowl{position:absolute;left:44px;right:0;height:2px;background:var(--ac)}
.C .foot{display:flex;gap:22px;padding:8px 14px;border-top:1px solid var(--line);font-family:var(--head);font-size:11px;color:var(--tx2)}
.C .tl{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-family:var(--head);font-size:11px;align-items:center}
.C .tl .ev{font-family:var(--font)}
.C .tick{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font:500 11px var(--head);border-bottom:1px solid var(--line);padding:8px 0;color:var(--tx2)}
.C .tick .on{color:var(--acx);background:var(--ac)}

/* D Soft: rounded cards, tinted fills, friendliest on touch */
.D{--font:"Plus Jakarta Sans",Inter,sans-serif;--head:"Plus Jakarta Sans",Inter,sans-serif;--hw:700;--ls:-.02em;--fs:14px;--r:14px;--pad:14px;--sl:.62;--sc:.14;--kx:#fff}
.D[data-m=light]{--bg:oklch(.965 .008 280);--bg2:oklch(1 0 0);--tx:oklch(.26 .03 280);--tx2:oklch(.46 .03 280);--tx3:oklch(.56 .025 280);--ac:oklch(.56 .2 295);--acx:#fff;--red:oklch(.56 .21 22)}
.D[data-m=dark]{--bg:oklch(.18 .02 280);--bg2:oklch(.24 .024 280);--tx:oklch(.95 .01 280);--tx2:oklch(.76 .02 280);--tx3:oklch(.65 .02 280);--ac:oklch(.72 .15 295);--acx:oklch(.18 .03 295);--red:oklch(.72 .17 22);--sl:.74;--kx:oklch(.18 .02 280)}
.D .wrap{flex:1;padding:22px;display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-auto-rows:min-content;gap:14px}
.D .card{background:var(--bg2);border-radius:22px;padding:18px;box-shadow:0 1px 2px #0000000d,0 8px 24px -14px #0003}
.D .card h3{font-size:14px;font-weight:700;margin-bottom:10px}
.D .hero{background:var(--c);color:var(--kx);grid-row:span 2}
.D .hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:30px 0 8px}
.D .hero .bar{height:8px;border-radius:9px;background:#fff4;margin-top:22px}.D .hero .bar i{display:block;height:100%;width:45%;border-radius:9px;background:currentColor}
.D .ev{margin-bottom:6px}
.D .ln{display:flex;gap:8px;align-items:center;min-height:30px}
.D[data-m=light] .hero{--sl:.46}
.D .subj{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:14px;background:color-mix(in oklch,var(--c) 14%,transparent);margin-bottom:6px;font-weight:600}
.D .fab{position:absolute;right:16px;bottom:74px;width:54px;height:54px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 20px -6px var(--ac)}

/* prototype bar: deliberately not part of any design */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#000;color:#fff;padding:6px 8px;border-radius:999px;font:500 13px Inter,sans-serif;box-shadow:0 6px 24px #0007;z-index:9;white-space:nowrap}
#bar button{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px}#bar button:hover{background:#fff3}
</style></head><body>
<div id="app"></div>
<div id="bar"><button id="p">←</button><span id="l"></span><button id="n">→</button><button id="m"></button></div>
<script>
const P={book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
flask:'<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
cap:'<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
pres:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24">${P[k]}</svg>`;
const KI={lecture:'book',lab:'flask',exam:'cap',presentation:'pres'};
const S={OSY:[250,'BI-OSY','Operating Systems'],PSI:[165,'BI-PSI','Computer Networks'],AAG:[305,'BI-AAG','Automata and Grammars'],SP1:[60,'BI-SP1','Software Project'],ZUM:[15,'BI-ZUM','Artificial Intelligence']};
const today=[
 {t:'09:15',k:'lecture',s:'OSY',n:'Lecture',r:'TH:A-1242',past:1},
 {t:'11:00',k:'lab',s:'PSI',n:'Lab',r:'T9:350'},
 {t:'14:30',k:'lecture',s:'AAG',n:'Lecture',r:'TH:A-1442'},
 {t:'16:15',k:'presentation',s:'SP1',n:'Project presentation',r:'T9:105'}];
const due=[
 {s:'OSY',n:'Homework 3',d:'Yesterday',o:1},{s:'PSI',n:'Lab report',d:'Today 23:59'},
 {s:'SP1',n:'Finish the slides',d:'Fri'},{s:'AAG',n:'Problem set 5',d:'Mon'}];
const sub=s=>`--h:${S[s][0]}`;
const ev=(e,x='')=>`<div class="ev sub ${e.k} ${e.past?'past':''} ${x}" style="${sub(e.s)}">${ic(KI[e.k])}<span class="ti">${S[e.s][1]} ${e.n}${e.r?' · '+e.r:''}</span></div>`;
const task=d=>`<div class="ln sub" style="${sub(d.s)}"><span class="dot"></span><span style="flex:1">${d.n} <span class="t3">${S[d.s][1]}</span></span><span class="${d.o?'over':'t2'}">${d.d}</span></div>`;
const tabs=`<div class="tabs"><b>Today</b><span>Calendar</span><span>Subjects</span><span>Search</span></div>`;
const st=`<div class="status"><span>11:40</span><span>5G</span></div>`;

const V={
A:{name:'Graphite',pitch:'Dense and quiet, like a tool you live in. Sidebar, near-zero borders, Inter, cool grey plus one indigo accent. Colour means Subject; the Event kind shows as an icon and a weight.',
 fonts:'Inter throughout · 13px desktop, 16px phone',radius:'6px',density:'Compact (34px rows)',kind:'Subject colour + icon',
 desk:()=>`<div class="side"><a class="on">${ic('home')} Today</a><a>${ic('cal')} Calendar</a><a>${ic('search')} Search</a><div class="t3" style="margin:16px 8px 6px;font-size:11px">B261</div>${Object.keys(S).map(k=>`<a class="sub" style="${sub(k)}"><span class="dot"></span>${S[k][2]}</a>`).join('')}</div>
 <div class="main"><div><div style="font-size:20px;font-weight:600;letter-spacing:-.02em">Thursday 5 November</div><h3>Today</h3>${today.map(e=>`<div class="ln"><span class="tm">${e.t}</span>${ev(e)}</div>`).join('')}<h3>Tomorrow</h3><div class="ln"><span class="tm">09:00</span>${ev({k:'exam',s:'ZUM',n:'Midterm',r:'TH:A-1242'})}</div></div>
 <div><h3 style="margin-top:32px">Due soon</h3>${due.map(task).join('')}</div></div>`,
 ph:()=>`${st}<div class="scroll" style="font-size:15px"><div style="font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px">Today</div>${today.map(e=>`<div class="ln" style="height:46px"><span class="tm">${e.t}</span>${ev(e)}</div>`).join('')}<h3>Due soon</h3>${due.slice(0,3).map(d=>task(d).replace('class="ln sub" style="','class="ln sub" style="min-height:44px;')).join('')}</div>${tabs}`},
B:{name:'Paper',pitch:'Calm and editorial, like a well-set notebook. No sidebar, one reading column, serif headings over warm paper, one terracotta accent. Almost no boxes: Event kinds read as a coloured icon and bold text.',
 fonts:'Newsreader headings + Inter text · 15px desktop, 17px phone',radius:'4px',density:'Spacious (one column)',kind:'Subject colour on icon, no fill',
 desk:()=>`<div class="top"><b>Chronos</b><span>Today &nbsp; Calendar &nbsp; Subjects &nbsp; Search</span></div><div class="col"><div class="t3">Thursday</div><h1>5 November</h1><div class="m">Today</div>${today.map(e=>`<div class="ln"><span class="t3">${e.t}</span>${ev(e)}</div>`).join('')}<div class="m">Due soon</div>${due.slice(0,3).map(d=>`<div class="ln"><span class="${d.o?'over':'t3'}" style="font-size:13px">${d.d.replace(' 23:59','')}</span><span>${d.n} <span class="t3">${S[d.s][1]}</span></span></div>`).join('')}</div>`,
 ph:()=>`${st}<div class="scroll" style="font-size:17px"><div class="t3" style="font-size:14px">Thursday</div><h1 style="font-size:38px">5 November</h1><div class="m">Today</div>${today.map(e=>`<div class="ln" style="grid-template-columns:54px 1fr"><span class="t3" style="font-size:14px">${e.t}</span>${ev({...e,r:''})}</div>`).join('')}<div class="m">Due soon</div>${due.slice(0,2).map(d=>`<div class="ln" style="grid-template-columns:1fr auto;font-size:15px"><span>${d.n}</span><span class="${d.o?'over':'t3'}" style="font-size:13px">${d.d.replace(' 23:59','')}</span></div>`).join('')}</div>${tabs}`},
C:{name:'Instrument',pitch:'Sharp and technical, like a timetable on a lab bench. The week grid is home, hairlines, mono numerals, square corners, neutral greys and a signal-orange "now". Here colour means Event kind, and Subject is just the code.',
 fonts:'JetBrains Mono headings and times + Inter text · 12.5px desktop, 15px phone',radius:'1px',density:'Very compact (grid)',kind:'Own hue per kind + icon',
 desk:()=>{const pos=(t,len)=>{const[h,m]=t.split(':').map(Number);return `top:${30+(h+m/60-8)*48}px;height:${len*48-3}px`};
 const b=(k,s,t,len,n)=>`<div class="ev sub ${k} blk" style="${pos(t,len)};${sub(s)}"><div>${S[s][1]}</div><div>${n}</div></div>`;
 const col=(d,inner,now)=>`<div class="gc ${now?'now':''}">${d}${inner}</div>`;
 return `<div class="rail"><span class="on">${ic('cal')}</span>${ic('home')}${ic('search')}</div><div class="gridw"><div class="hd"><b>WEEK 45 · B261</b><span class="t2">11:40 · next BI-AAG 14:30</span></div><div class="grid"><div class="gc">${[8,10,12,14,16].map(h=>`<span class="hr" style="top:${30+(h-8)*48}px">${h}</span>`).join('')}</div>${col('MON 02',b('lecture','OSY','09:15',1.5,'Lecture')+b('lab','ZUM','12:45',1.5,'Lab'))}${col('TUE 03',b('lecture','PSI','11:00',1.5,'Lecture'))}${col('WED 04',b('lab','OSY','14:30',1.5,'Lab'))}${col('THU 05',b('lecture','OSY','09:15',1.5,'Lecture').replace('blk','blk past')+b('lab','PSI','11:00',1.5,'Lab')+b('lecture','AAG','14:30',1.5,'Lecture')+b('presentation','SP1','16:15',.75,'Present'),1)}${col('FRI 06',b('exam','ZUM','09:00',1.5,'Midterm'))}<div class="nowl" style="top:${30+3.67*48}px"></div></div><div class="foot"><span class="over">▲ OVERDUE BI-OSY Homework 3</span><span>DUE 23:59 BI-PSI Lab report</span><span>DUE FRI BI-SP1 Finish the slides</span></div></div>`},
 ph:()=>`${st}<div class="tick">${['M 2','T 3','W 4','T 5','F 6','S 7','S 8'].map((d,i)=>`<span class="${i==3?'on':''}">${d}</span>`).join('')}</div><div class="scroll" style="font-size:15px">${today.map(e=>`<div class="tl"><span class="t2">${e.t}</span>${ev({...e,r:''})}</div>`).join('')}<div class="tl"><span class="over">OVER</span><span>Homework 3</span></div><div class="tl"><span class="t2">23:59</span><span>Lab report</span></div></div>${tabs}`},
D:{name:'Soft',pitch:'Warm and friendly, closest to a modern iPhone app. A mosaic of big rounded cards, filled Subject colour on what matters now, a floating add button. The most colour of the four.',
 fonts:'Plus Jakarta Sans throughout · 14px desktop, 16px phone',radius:'14-22px',density:'Comfortable (cards)',kind:'Subject colour + icon, filled tints',
 desk:()=>`<div class="wrap"><div class="card hero sub" style="${sub('PSI')}"><div>Now · until 12:30</div><div class="big">BI-PSI Lab</div><div>T9:350</div><div class="bar"><i></i></div></div><div class="card"><h3>Next up</h3>${today.slice(2).map(e=>ev(e)).join('')}${ev({k:'exam',s:'ZUM',n:'Midterm Fri'})}</div><div class="card"><h3>Due soon</h3>${due.slice(0,3).map(task).join('')}</div><div class="card" style="grid-column:span 2"><h3>Subjects</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">${Object.keys(S).map(k=>`<div class="subj sub" style="${sub(k)}"><span class="dot"></span>${S[k][2]}</div>`).join('')}</div></div></div>`,
 ph:()=>`${st}<div class="scroll" style="font-size:16px"><div style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px">Today</div><div class="card hero sub" style="${sub('PSI')}"><div style="font-size:13px">Now · until 12:30</div><div class="big" style="margin:8px 0 2px;font-size:24px">BI-PSI Lab</div><div style="font-size:13px">T9:350</div></div><div class="card" style="margin-top:12px"><h3>Next up</h3>${today.slice(2).map(e=>ev({...e,r:''})).join('')}</div><div class="card" style="margin-top:12px"><h3>Due soon</h3>${due.slice(0,2).map(task).join('')}</div></div><div class="fab">+</div>${tabs}`}
};
const keys=Object.keys(V);let q=new URLSearchParams(location.search),v=keys.includes(q.get('variant'))?q.get('variant'):'A',m=q.get('mode')=='light'?'light':'dark';
function draw(){const x=V[v],o=m=='dark'?'light':'dark',T=(mode,h,c='')=>`<div class="t ${v} ${c}" data-m="${mode}">${h}</div>`;
 const kinds=[{k:'lecture',s:'OSY',n:'Lecture'},{k:'lab',s:'PSI',n:'Lab'},{k:'exam',s:'ZUM',n:'Exam'},{k:'presentation',s:'SP1',n:'Presentation'}];
 const tile=mode=>T(mode,`<div class="sw">${['--bg','--bg2','--tx2','--tx','--ac','--red'].map(c=>`<i style="background:var(${c})"></i>`).join('')}</div>
 <div class="spec"><div class="h">Chronos 14:30</div><div class="t2" style="margin-top:4px">Regular text with a <b style="font-weight:600;color:var(--tx)">stronger word</b> and a quieter tail.</div></div>
 <div class="kinds">${kinds.map(e=>ev({...e,r:''})).join('')}<div class="ev t2">${ic('flag')}<span class="ti">Task deadline, a marker and not a block</span></div></div>
 <div class="btns"><span class="btn">Add Task</span><span class="btn g">Cancel</span><span class="over" style="font-size:13px">Overdue</span></div>`,'tile');
 document.getElementById('app').innerHTML=`<div class="name">${v} · ${x.name}</div><div class="pitch">${x.pitch}</div>
 <div class="sec">Style tile, light and dark</div><div class="row2">${tile('light')}${tile('dark')}</div>
 <div class="sec">Desktop · Today</div><div class="fit" id="fit">${T(m,x.desk(),'desk')}</div>
 <div class="sec">iPhone · Today</div><div class="row2" style="padding:6px"> ${T(m,x.ph(),'phone')}<div style="flex:1;min-width:240px;font-size:13px;line-height:1.9"><b>Current state</b><br>Direction: ${x.name}<br>Mode: ${m}<br>Type: ${x.fonts}<br>Radius: ${x.radius}<br>Density: ${x.density}<br>Event kinds: ${x.kind}</div></div>`;
 const f=document.getElementById('fit'),d=f.firstChild,z=Math.min(1,f.clientWidth/1120);d.style.zoom=z;
 document.getElementById('l').textContent=`${v} (${x.name})`;document.getElementById('m').textContent=o=='light'?'Light':'Dark';
 try{history.replaceState(0,'',`?variant=${v}&mode=${m}`)}catch(e){}}
const go=s=>{v=keys[(keys.indexOf(v)+s+keys.length)%keys.length];draw();scrollTo(0,0)};
p.onclick=()=>go(-1);n.onclick=()=>go(1);document.getElementById('m').onclick=()=>{m=m=='dark'?'light':'dark';draw()};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key=='ArrowLeft')go(-1);if(e.key=='ArrowRight')go(1)});
addEventListener('resize',draw);draw();
</script></body></html>
